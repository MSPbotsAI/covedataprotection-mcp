services:
  covedataprotection-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: covedataprotection-mcp:latest
    container_name: covedataprotection-mcp-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MCP_HTTP_PORT=8080
      - COVEDATAPROTECTION_BASE_URL=https://api.backup.management/jsonapi
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
